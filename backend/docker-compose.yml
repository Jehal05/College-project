services:
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env          # create it first: copy .env.example to .env and fill in real keys
    volumes:
      - .:/code       # your code and the SQLite file live in this folder
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
