# Automatic check for the backend (Daksh's part).
# Runs on every push and pull request that touches backend/: install the pinned packages and run all the tests.
# Put this file at the repo root:  .github/workflows/backend.yml
name: Backend checks

# Manual only (changed on request: automatic runs were causing problems). Start it from the Actions tab with "Run workflow".
# To bring automatic runs back, restore the push and pull_request triggers from git history (commit before this change).
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock.txt
      - name: Install the pinned packages
        run: pip install -r requirements.lock.txt
      # Lint (ruff): looks for real mistakes only (see backend/ruff.toml). 23 findings exist today (17 unused imports,
      # 6 unused variables), so this step reports them but does not fail the check yet. Remove continue-on-error after cleanup.
      - name: Lint (ruff, informational for now)
        run: |
          pip install ruff==0.16.9
          ruff check . --config ruff.toml
        continue-on-error: true
      - name: Run all the tests
        run: python -m pytest -q
      - name: Contract status (information only, never fails the check)
        run: python scripts/contract_status.py
        continue-on-error: true
