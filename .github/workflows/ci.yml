# Manual checks: Actions tab > CI > Run workflow. Runs the tests that need no browser and no internet.
name: CI
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: Patient app build
        run: npm run build
      - name: Patient app unit tests
        run: npm test
      - name: Hospital portal tests
        run: npm ci && npm test
        working-directory: hospital-portal
      - name: Mock server tests
        run: node --test tests/*.test.js
        working-directory: mock-server
