# Runs on every push and pull request: install, build, unit tests, contract test, accessibility audit, browser tests.
name: CI
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build
      - name: Unit tests
        run: npm run test:unit -w patient-app
      - name: Start the mock server for the contract test and the audit
        run: |
          (cd mock-server && DEMO_SPEED=10 node server.js &) 
          (cd patient-app && npx vite preview --port 5173 --strictPort &)
          npx --yes wait-on http://localhost:4000/health http://localhost:5173
      - name: API contract test (mock server)
        run: npm run contract -- http://localhost:4000
      - name: Integration check
        run: npm run integration
      - name: Accessibility audit (axe-core, 3 languages)
        run: npm run audit
      - name: Browser tests
        run: npm run test:browser -w patient-app
